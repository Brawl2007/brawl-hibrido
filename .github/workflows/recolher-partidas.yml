# Recolha de partidas Ranked, corrida aqui e não na Vercel (v189).
#
# A Vercel pausou o site em 19/11/2026 por passar o limite de CPU do plano
# Hobby. O repositório é público: o GitHub Actions não cobra estes minutos.
# Ver server/recolhaNoGithub.ts. Segredos precisos (Settings → Secrets and
# variables → Actions): DATABASE_URL e DATABASE_CA_CERT — os mesmos da Vercel.
name: Recolher partidas Ranked

on:
  schedule:
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recolher-partidas-ranked
  cancel-in-progress: false

jobs:
  recolher:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Recolher
        env:
          NODE_ENV: production
          DISABLE_MANUS_RUNTIME: "1"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_CA_CERT: ${{ secrets.DATABASE_CA_CERT }}
          # Os IPs do GitHub mudam: só o proxy da RoyaleAPI aceita a chave assim.
          BRAWL_STARS_API_VIA: royaleapi
        run: pnpm exec tsx scripts/recolher-partidas.ts
