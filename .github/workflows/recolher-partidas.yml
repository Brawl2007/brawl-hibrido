# Recolha Ranked, uma vez por hora (v190). GitHub pode atrasar ou descartar chamadas.
# Era a cada 15 minutos e a Vercel pausou o site em 19/11/2026 por passar o
# limite de CPU do plano Hobby: de hora a hora gasta cerca de quatro vezes menos.
# O /api/partidas/agendar (agendador externo) já não recolhe: só esta chamada.
name: Recolher partidas Ranked

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recolher-partidas-ranked
  cancel-in-progress: false

jobs:
  recolher:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pedir a recolha ao site
        run: |
          set -euo pipefail
          ficheiro=$(mktemp)
          trap 'rm -f "$ficheiro"' EXIT
          codigo=0
          curl --fail-with-body --silent --show-error --max-time 240 \
            https://brawl-hibrido.vercel.app/api/partidas/recolher --output "$ficheiro" || codigo=$?
          if [ "$codigo" -ne 0 ] && grep -q "DEPLOYMENT_DISABLED" "$ficheiro" 2>/dev/null; then
            # Site pausado pela Vercel: não é uma falha da recolha, e não vale um email por hora.
            echo "::warning::O site está pausado pela Vercel; a recolha volta quando ele voltar."
            exit 0
          fi
          if [ "$codigo" -ne 0 ]; then
            # Só imprime o diagnóstico público sanitizado, nunca SQL ou HTML.
            jq -c '{ok, errorCode, etapa, error: (if .errorCode then .error else "O servidor não forneceu um diagnóstico sanitizado." end)}' "$ficheiro" 2>/dev/null || true
            echo "::error::O pedido de recolha falhou (curl $codigo). Consulta o diagnóstico acima."
            exit "$codigo"
          fi
          jq -e 'type == "object"' "$ficheiro" > /dev/null
          cat "$ficheiro"
          if jq -e '.ok == true' "$ficheiro" > /dev/null; then
            novas=$(jq -r '.battlesInserted' "$ficheiro")
            echo "Recolha concluída: $novas partidas novas." >> "$GITHUB_STEP_SUMMARY"
          elif jq -e '.saltada == true' "$ficheiro" > /dev/null; then
            motivo=$(jq -r '.motivo' "$ficheiro")
            echo "::warning::Recolha não executada: $motivo"
            echo "Recolha não executada: $motivo" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::A recolha falhou."
            exit 1
          fi

