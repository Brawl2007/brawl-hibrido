<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <!--
      Sem `maximum-scale=1`: bloqueava o zoom com dois dedos no telemóvel.

      Quem precisa de aproximar para ler — e há muito texto a 7 px neste
      desenho — ficava sem poder fazê-lo. Não se ganhava nada com o bloqueio:
      serve para evitar o salto de zoom que o iOS dá ao tocar num campo de
      texto, e isso resolve-se com o tamanho da letra do campo, não tirando o
      zoom a toda a gente.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0e14" />
    <meta name="description" content="Brawl Híbrido — inteligência competitiva para a rotação Ranked de Brawl Stars." />
    <link rel="icon" type="image/svg+xml" href="/marca/logo-provisorio.svg" />
    <!--
      A pré-visualização quando o endereço é partilhado (WhatsApp, Discord,
      Telegram, X): título, descrição e imagem. Os leitores dessas aplicações
      não correm JavaScript, por isso tem de estar aqui, no HTML, e a imagem
      tem de ter o endereço completo. A imagem é client/public/partilha.png
      (1200×630).
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Brawl Híbrido" />
    <meta property="og:locale" content="pt_PT" />
    <meta property="og:url" content="https://brawl-hibrido.vercel.app/" />
    <meta property="og:title" content="Brawl Híbrido — Draft do Ranked com dados" />
    <meta property="og:description" content="Sugestões de picks e bans para o Ranked de Brawl Stars, counters, mapas da rotação e um plano do general no mapa 3D." />
    <meta property="og:image" content="https://brawl-hibrido.vercel.app/partilha.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Brawl Híbrido: Draft do Ranked com dados, Azul contra Vermelha." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Brawl Híbrido — Draft do Ranked com dados" />
    <meta name="twitter:description" content="Sugestões de picks e bans, counters, mapas e um plano do general no mapa 3D." />
    <meta name="twitter:image" content="https://brawl-hibrido.vercel.app/partilha.png" />
    <!--
      Os tipos de letra passaram a ser servidos daqui.

      Antes eram dois domínios externos a bloquear a pintura: o browser tinha
      de abrir fonts.googleapis.com para ler a folha de estilos e só depois
      ia a fonts.gstatic.com buscar os ficheiros. Até isso acontecer, o
      título de 88px da entrada aparecia num sans qualquer e saltava para o
      tipo certo a meio — e é o Lilita One que dá à interface o ar do jogo.
      A identidade chegava atrasada e a saltar.

      Agora são 100 KB servidos do mesmo sítio que o resto. O Lilita One vai
      pré-carregado porque é o primeiro que se vê; os outros entram com
      `font-display: swap`, declarados no index.css.

      Ficheiros e licenças: client/public/tipos/LEIA-ME.txt
    -->
    <link rel="preload" href="/tipos/lilita-one-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/tipos/space-grotesk-var.woff2" as="font" type="font/woff2" crossorigin />
    <title>Brawl Híbrido — Ranked intelligence</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script defer src="%VITE_ANALYTICS_ENDPOINT%/umami" data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>
</html>
